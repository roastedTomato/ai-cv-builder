[project]
name = "ai-cv-builder"
version = "0.1.0"
description = "第一阶段简历生成与 Word/PDF 导出验证 CLI"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.60,<3",
  "python-docx>=1.1,<2",
]

[project.scripts]
cvbuilder = "cvbuilder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cvbuilder*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
