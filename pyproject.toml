[project]
name = "ai-cv-builder"
version = "0.1.0"
description = "第一阶段简历生成与 Word/PDF 导出验证 CLI"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.60,<3",
  "python-docx>=1.1,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
cvbuilder = "cvbuilder.cli:main"
cvbuilder-web = "cvbuilder.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cvbuilder*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
