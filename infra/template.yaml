AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fictional-account resume builder test environment in Sydney

Parameters:
  BillingEmail:
    Type: String
    Description: Email address to receive the USD 50 monthly AWS budget alert
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{5,62}$'
    Description: Unique Cognito managed-login prefix in ap-southeast-2

Globals:
  Function:
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        CV_MYSQL_HOST: !GetAtt MySQLDatabase.Endpoint.Address
        CV_MYSQL_PORT: '3306'
        CV_MYSQL_DATABASE: cvbuilder
        CV_MYSQL_SECRET_ARN: !GetAtt MySQLDatabase.MasterUserSecret.SecretArn
        CV_FILES_BUCKET: !Ref TemporaryFiles
        CV_OPENAI_SECRET_ARN: !Ref OpenAISecret
    VpcConfig:
      SecurityGroupIds: [!Ref LambdaSecurityGroup]
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

Resources:
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AppVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicDefaultRoute
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref AppVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda access to private MySQL and outbound services
      VpcId: !Ref AppVpc

  MySQLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL only from app Lambda functions
      VpcId: !Ref AppVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  MySQLSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private MySQL subnets for fictional test environment
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: mysql
      EngineVersion: 8.4.9
      DBName: cvbuilder
      MasterUsername: cvbuilder_admin
      ManageMasterUserPassword: true
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      DBSubnetGroupName: !Ref MySQLSubnetGroup
      VPCSecurityGroups: [!Ref MySQLSecurityGroup]
      Port: '3306'

  TemporaryFiles:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub 'https://${Distribution.DomainName}'
            AllowedMethods: [GET, HEAD, PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTemporaryFiles
            Status: Enabled
            ExpirationInDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  OpenAISecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: OpenAI API key for the fictional-account test environment; set after stack creation
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  StaticSite:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: StaticOrigin
            DomainName: !GetAtt StaticSite.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: StaticOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
          DefaultTTL: 300
          MinTTL: 0
          MaxTTL: 3600
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  StaticSitePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticSite
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StaticSite.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-test-users'
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub 'https://${Distribution.DomainName}/'
      LogoutURLs:
        - !Sub 'https://${Distribution.DomainName}/'
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${Distribution.DomainName}'
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile.cloud
      DockerTag: api
    Properties:
      PackageType: Image
      ImageConfig:
        Command: [cvbuilder.cloud.handler]
      MemorySize: 1024
      Timeout: 29
      Environment:
        Variables:
          CV_WORKER_FUNCTION: !Ref WorkerFunction
          CV_COGNITO_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
          CV_COGNITO_CLIENT_ID: !Ref UserPoolClient
          CV_CORS_ORIGIN: !Sub 'https://${Distribution.DomainName}'
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref TemporaryFiles
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkerFunction
        - Statement:
            - Sid: ReadMySQLCredential
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt MySQLDatabase.MasterUserSecret.SecretArn
      Events:
        ProtectedApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes: [openid]
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  WorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile.cloud
      DockerTag: worker
    Properties:
      PackageType: Image
      ImageConfig:
        Command: [cvbuilder.cloud_tasks.handler]
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 1024
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref TemporaryFiles
        - Statement:
            - Sid: ReadMySQLCredential
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt MySQLDatabase.MasterUserSecret.SecretArn
            - Sid: ReadOpenAIKey
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref OpenAISecret

  MigratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile.cloud
      DockerTag: migrator
    Properties:
      PackageType: Image
      ImageConfig:
        Command: [cvbuilder.mysql_migrate.handler]
      MemorySize: 512
      Timeout: 120
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Sid: ReadMySQLCredential
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt MySQLDatabase.MasterUserSecret.SecretArn

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WorkerFunction}'
      RetentionInDays: 14

  TaskFailureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '"Task failed"'
      MetricTransformations:
        - MetricNamespace: CVBuilder/Test
          MetricName: TaskFailures
          MetricValue: '1'

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref BillingEmail

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarm
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda errors in the test environment
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker Lambda invocation errors in the test environment
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  TaskFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker completed a task with failed status
      Namespace: CVBuilder/Test
      MetricName: TaskFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-usd50'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 50
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BillingEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BillingEmail

Outputs:
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}/'
  SiteBucket:
    Value: !Ref StaticSite
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  HostedUiDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  MySQLMigrationFunction:
    Value: !Ref MigratorFunction
  MySQLHost:
    Value: !GetAtt MySQLDatabase.Endpoint.Address
  TemporaryBucket:
    Value: !Ref TemporaryFiles
  SecretArn:
    Value: !Ref OpenAISecret
