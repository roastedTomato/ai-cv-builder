<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地简历生成平台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">基础简历保存在本机</p><h1>简历工作台</h1><p>建立基础简历，按岗位整理并导出。使用 AI 导入和生成时，简历与岗位内容会发送给 OpenAI 处理。</p></div><span class="local">● 本地运行</span></header>
<section class="card"><h2>基础简历</h2><div id="resume-state" class="hint">正在读取本机简历…</div><div class="row"><label id="upload-control" class="button secondary">导入 DOCX / DOC / PDF<input id="upload" type="file" accept=".docx,.doc,.pdf"></label><button id="save" type="button">保存基础简历</button><button id="edit" type="button" hidden>编辑基础简历</button><button id="delete" class="danger">删除基础简历</button><button id="reset" class="danger secondary">重置全部数据</button></div><form id="resume-form"></form><div id="draft-area"></div></section>
<section class="card"><h2>岗位简历</h2><label for="job">粘贴招聘要求</label><textarea id="job" rows="7" placeholder="粘贴职位描述与任职要求"></textarea><button id="generate" type="button">生成岗位简历</button></section>
<section class="card"><h2>检查与导出</h2><p class="notice">AI 生成内容未经事实核验。请检查并直接修改下面的简历正文后再导出。</p><textarea id="generated" rows="22" placeholder="生成后的完整简历正文会显示在这里，可直接修改"></textarea><div class="row"><label>模板<select id="template"></select></label><label>格式<select id="format"><option value="docx">Word (.docx)</option><option value="pdf">PDF</option></select></label><button id="export">下载</button></div></section><div id="status" role="status"></div></main><script src="/static/app.js"></script></body></html>
