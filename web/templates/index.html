<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地简历生成平台</title><link rel="stylesheet" href="/static/style.css?v=phase3-progress-1"><script src="/static/app.js?v=phase3-progress-1" defer></script></head>
<body><main>
  <header><div><p class="eyebrow">基础简历与求职记录保存在本机</p><h1>简历工作台</h1><p>按岗位生成、编辑和导出简历版本。</p></div><span class="local">● 本地运行</span></header>
  <section class="card base-card"><details><summary><strong>基础简历</strong><span id="resume-state" class="hint">正在读取本机简历…</span></summary><div class="row"><label id="upload-control" class="button secondary">导入 DOCX / DOC / PDF<input id="upload" type="file" accept=".docx,.doc,.pdf"></label><button id="save" type="button">保存基础简历</button><button id="edit" type="button" hidden>编辑基础简历</button><button id="delete" class="danger" type="button">删除基础简历</button><button id="reset" class="danger secondary" type="button">重置全部数据</button></div><div id="base-progress" class="progress-status" role="status" aria-live="polite" hidden><span>正在解析简历，请稍候…</span><progress aria-label="正在解析基础简历"></progress></div><form id="resume-form"></form><div id="draft-area"></div></details></section>
  <div class="workspace">
    <aside class="card navigation"><div class="section-heading"><h2>求职记录</h2><button id="add-company" class="secondary small" type="button">＋ 公司</button></div><form id="company-form" class="compact-form" hidden><input id="company-name" placeholder="公司名称" required><button type="submit">添加</button></form><div id="company-list" class="tree"></div><div id="job-form-wrap" hidden><h3>添加岗位</h3><form id="job-form" class="compact-form"><input id="job-title" placeholder="职位名称" required><textarea id="job-text" rows="5" placeholder="粘贴招聘要求" required></textarea><button type="submit">保存岗位</button></form></div></aside>
    <section class="card resume-column"><div class="section-heading"><div><h2 id="current-title">选择一个岗位</h2><p id="current-meta" class="hint">从左侧选择公司和岗位，查看简历版本。</p></div><div class="row tight"><button id="create-version" type="button" disabled>确认生成简历</button><button id="edit-version" type="button" class="secondary" hidden>编辑</button><button id="save-version" type="button" hidden>保存</button><button id="cancel-version" type="button" class="secondary" hidden>取消</button></div></div><p class="notice">AI 生成内容未经事实核验。请核对简历内容后再导出。</p><div id="generation-progress" class="progress-status" role="status" aria-live="polite" hidden><span>正在生成简历，请稍候…</span><progress aria-label="正在生成岗位简历"></progress></div><div id="resume-document" class="resume-document empty">选择岗位版本后，这里会显示简历。</div></section>
    <aside class="card appearance"><h2>模板与外观</h2><label>模板<select id="template"></select></label><label>主题颜色<select id="color"><option value="#2C5263">蓝灰</option><option value="#16766d">青绿</option><option value="#315f9b">蓝色</option><option value="#7a4b78">紫色</option><option value="#a45c34">暖棕</option></select></label><label>页面宽度<select id="page-width"><option value="narrow">窄</option><option value="standard" selected>标准</option><option value="wide">宽</option></select></label><div class="export-row"><label>格式<select id="format"><option value="docx">Word (.docx)</option><option value="pdf">PDF</option></select></label><button id="export" type="button" disabled>下载</button></div></aside>
  </div><div id="status" role="status"></div>
</main></body></html>
